name: Daily report

# 09:00 IST: what the crawler did in the last 24 hours, failing sources, and how much of
# the free LLM quota was used. Shown in the job summary, and sent to Telegram when
# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are set.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SARKARI_DATABASE_URL: ${{ secrets.SARKARI_DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[crawler]"
      - run: python -m sarkari_crawler.run report --hours 24
