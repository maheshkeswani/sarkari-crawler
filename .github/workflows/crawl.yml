name: Crawl

# Every 30 minutes: crawl the sources that are due, extract new notices with the free
# LLM tier, publish them, and close expired recruitments. When the free quota runs out,
# the rest of the queue waits for the next run. Public repo: Actions minutes are free.
#
# Note: GitHub pauses scheduled workflows in a public repo after 60 days without a commit.
# Re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      max_documents:
        description: "LLM extractions this run"
        default: "15"
      no_extract:
        description: "Only look for new links"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SARKARI_DATABASE_URL: ${{ secrets.SARKARI_DATABASE_URL }}
      SARKARI_EXTRACTORS: ${{ vars.SARKARI_EXTRACTORS || 'groq:openai/gpt-oss-120b' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SARKARI_USER_AGENT: ${{ vars.SARKARI_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tesseract (scanned PDFs, Hindi)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-hin
      - run: pip install -e ".[crawler]"
      - name: Crawl, extract, publish
        run: |
          args=(--max-documents "${{ inputs.max_documents || '15' }}")
          if [ "${{ inputs.no_extract }}" = "true" ]; then args+=(--no-extract); fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then args+=(--trigger manual); fi
          python -m sarkari_crawler.run crawl "${args[@]}"
